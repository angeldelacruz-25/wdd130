<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us: Angel Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr.png" alt="Water Rafting Logo" width="200">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a class="current" href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="info">
            <h3>Contact Us</h3>
            <article>
                <p>Angel Rafting Company</p>
                <p>Av. Joaquin Aybar</p>
                <p>Bahoruco, Dominican Republic</p>
                <p>1+ 777 777 7777</p>
                <p>info@angelrafting.com</p>
            </article>
        </div>
        <div class="contact-container">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d242168.58320609972!2d-71.64230854567867!3d18.488907759698282!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2sdo!4v1790817707625!5m2!1ses-419!2sdo"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <section class="contact-form">
                <h2>Contact Us</h2>

                <form>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="general" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5"
                      placeholder="Type here"></textarea>

                    <label class="newsletter">
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>
        <section class="members">
            <h2>We Are Here To serve You</h2>
            <div>
                <figure>
                    <img src="images/angel_manager.jpg" alt="Angel Rafting Manager">
                    <figcaption>Angel: Rafting Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/cesar_rafting_expert.jpg" alt="Cesar Rafting Expert">
                    <figcaption>Cesar: Rafting Expert</figcaption>
                </figure>
                <figure>
                    <img src="images/flor_guide.jpg" alt="Flor Main Guide">
                    <figcaption>Flor: Tour Main Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 ♣ Angel Rafting Company ♣ Angel De La Cruz</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-icon.png" alt="Facebook icon" width="30">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.jpg" alt="instagram icon" width="30">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-icon.png" alt="linkedin icon" width="30">
            </a>
        </nav>
    </footer>
</body>

</html>
